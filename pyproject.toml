[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chill-agent"
version = "0.1.0"
description = "Autonomous YouTube channel agent — Chill Dude Explains"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "structlog>=24.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "apscheduler>=3.10.0",
    "ffmpeg-python>=0.2.0",
    "Pillow>=10.0.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "google-api-python-client>=2.130.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "replicate>=0.28.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pydub>=0.25.1",
    "requests>=2.31.0",
    "tenacity>=8.3.0",
    "json-repair>=0.30.0",
]

[project.optional-dependencies]
whisperx = [
    "whisperx>=3.1.0",
    "torch>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
chill-agent = "chill_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chill_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (may mock external APIs)",
]
